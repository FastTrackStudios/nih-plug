[package]
name = "nih_plug_dioxus"
version = "0.0.0"
edition = "2021"
authors = ["Cody Wright"]
license = "ISC"
description = "Dioxus Native GUI support for NIH-plug"

[features]
default = ["hot-reload"]
hot-reload = ["dep:dioxus-devtools"]
# Enable embedded editor support (requires nih-plug fork with embedded editor support)
embedded = ["dep:anyrender_vello_cpu", "dep:anyrender"]
# Use CPU rendering with softbuffer (works on Linux/XWayland where wgpu surfaces fail)
cpu-rendering = ["dep:anyrender_vello_cpu", "dep:anyrender", "dep:softbuffer"]
# Use wgpu offscreen rendering + softbuffer blit (works on Linux/XWayland, keeps GPU rendering)
softbuffer-blit = ["dep:softbuffer"]

[dependencies]
nih_plug = { path = "..", default-features = false }

# Use dioxus-native from blitz repo which includes all the rendering + re-exports dioxus core
dioxus-native = { git = "https://github.com/DioxusLabs/blitz.git", features = ["prelude"] }

# Blitz crates from git for latest CSS support
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git" }

# Rendering
anyrender_vello = "0.6"
vello = { version = "0.6", features = ["wgpu"] }
wgpu = "26"
wgpu_context = "0.1"  # For DeviceHandle type used by CustomPaintSource

# CPU rendering for embedded editor (optional)
anyrender_vello_cpu = { version = "0.8", optional = true }
anyrender = { version = "0.6", optional = true }
softbuffer = { version = "0.4", optional = true }

# Window management - using fork with raw-window-handle 0.6 for softbuffer compatibility
baseview = { git = "https://github.com/Codys-Wright/baseview.git", branch = "upgrade_rwh" }

# raw-window-handle 0.6 (compatible with baseview fork, wgpu, and softbuffer)
raw-window-handle = "0.6"

# Hot reload
dioxus-devtools = { version = "0.7", optional = true }

# Utilities
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
pollster = "0.4"
# Use the same keyboard-types version as baseview to avoid conflicts
keyboard-types = "0.6"

# Examples are disabled for now (require additional dependencies from lib-ref)
# [[example]]
# name = "standalone"
# path = "examples/standalone.rs"

[dev-dependencies]
# Example needs these directly
pollster = "0.4"
